site_name: Blueprint Framework Documentation
site_description: Documentation for the Blueprint Go framework
site_author: Blueprint Framework
site_url: https://oddbit-project.github.io/blueprint/

repo_name: blueprint
repo_url: https://github.com/oddbit-project/blueprint
edit_uri: edit/develop/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/lightbulb
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

nav:
  - Home: index.md

  - Getting Started:
    - Application Container: container.md
    - Configuration: config/config.md
    - Logging: log/logging.md
    - File Logging: log/file_logging.md

  - Database:
    - Overview: db/index.md
    - dbx Repositories: db/dbx.md
    - gohan Query Builder: db/gohan.md
    - Database Client: db/client.md
    - Structs and Tags: db/structs-and-tags.md
    - Migrations: db/migrations.md
    - Drivers:
      - PostgreSQL: provider/pgsql.md
      - SQLite: provider/sqlite.md
      - ClickHouse: provider/clickhouse.md
    - Migrating from db to dbx: db/migrating-to-dbx.md
    - Legacy db Package:
      - Overview: db/legacy-overview.md
      - Repository: db/repository.md
      - Data Grid: db/dbgrid.md
      - Field Specifications: db/fields.md
      - Query Builder: db/query-builder.md
      - Database Functions: db/functions.md
      - SQL Update API: db/sql-update-api.md

  - HTTP Server:
    - Overview: provider/httpserver/index.md
    - API Reference: provider/httpserver/api-reference.md
    - Middleware: provider/httpserver/middleware.md
    - Authentication: provider/httpserver/auth.md
    - Security & Headers: provider/httpserver/security.md
    - Sessions: provider/httpserver/session.md
    - Request Validation: provider/httpserver/validation.md
    - Request Utilities: provider/httpserver/request.md
    - Examples: provider/httpserver/examples.md
    - Troubleshooting: provider/httpserver/troubleshooting.md
    - Performance: provider/httpserver/performance.md

  - Security & Auth:
    - Secure Credentials: crypt/secure-credentials.md
    - Password Hashing: crypt/password-hashing.md
    - PIN Generation: crypt/pin.md
    - TLS: provider/tls.md
    - JWT: provider/jwtprovider.md
    - HMAC: provider/hmacprovider.md
    - htpasswd: provider/htpasswd.md
    - Rate Limiter: provider/ratelimiter.md

  - Integrations:
    - Messaging:
      - Franz (Kafka): provider/franz.md
      - Kafka (Legacy): provider/kafka.md
      - Kafka to Franz Migration: provider/kafka-to-franz-migration.md
      - MQTT: provider/mqtt.md
      - NATS: provider/nats.md
    - Storage & Cache:
      - Redis: provider/redis.md
      - etcd: provider/etcd.md
      - KV Store: provider/kv.md
      - S3: provider/s3.md
    - Observability:
      - Metrics: provider/metrics.md
      - Prometheus: provider/prometheus.md
    - Email:
      - SMTP: provider/smtp.md

  - Utilities:
    - Runner: runner/runner.md
    - BatchWriter: batchwriter/batchwriter.md
    - ThreadPool: threadpool/threadpool.md
    - Console: console/console.md
    - Types: types/types.md
    - Utils: utils/utils.md
    - Runtime Tags: runtime/runtime.md
    - Contributing:
      - Release Process: release-process.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oddbit-project/blueprint
  generator: false

copyright: Copyright &copy; 2025-2026 Blueprint Framework
