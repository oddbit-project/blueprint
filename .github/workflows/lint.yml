name: lint

on:
  push:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - provider/clickhouse
          - provider/etcd
          - provider/franz
          - provider/hmacprovider
          - provider/htpasswd
          - provider/httpserver
          - provider/jwtprovider
          - provider/kafka
          - provider/metrics
          - provider/mqtt
          - provider/nats
          - provider/pgsql
          - provider/prometheus
          - provider/redis
          - provider/s3
          - provider/smtp
          - provider/sqlite
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
