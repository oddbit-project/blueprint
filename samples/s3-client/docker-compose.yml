version: '3.8'

services:
  minio:
    # hardened MinIO (github.com/blackshieldpt/hardened-images); distroless, so no curl healthcheck
    image: ghcr.io/blackshieldpt/minio:0.20260717.120751
    container_name: minio-s3-demo
    ports:
      - "9010:9000"   # S3 API
      - "9011:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Optional: MC (MinIO Client) for administrative tasks
  mc:
    # the -dev variant adds a shell; mc is included in the hardened MinIO image
    image: ghcr.io/blackshieldpt/minio:0.20260717.120751-dev
    container_name: minio-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/demo-bucket --ignore-existing;
      /usr/bin/mc anonymous set public local/demo-bucket;
      echo 'MinIO setup complete. Demo bucket created.';
      tail -f /dev/null
      "
    restart: unless-stopped

volumes:
  minio-data:
    driver: local